# Packages installed for each profile, by package manager.
# Every profile gets the manager's "common" list plus its own list, if any.

# macOS CLI tools (brew install)
[packages.brew]
common = [
    "fd",
    "fzf",
    "gh",
    "git-delta",
    "jq",
    "lazygit",
    "neovim",
    "ripgrep",
    "sesh",
    "tmux",
    "zoxide",
]
personal = ["cloudflared", "mise", "ncdu", "tlrc"]

# macOS GUI apps (brew install --cask)
[packages.cask]
common = ["ghostty", "raycast", "scroll-reverser"]
personal = [
    "codex",
    "firefox",
    "google-chrome",
    "google-gemini",
    "karabiner-elements",
    "nordvpn",
    "orbstack",
    "tailscale-app",
    "visual-studio-code",
    "vlc",
    "zoom",
]

# Linux packages (apt install). fzf, lazygit, sesh and nvim come from
# .chezmoiexternal.toml.tmpl instead.
[packages.apt]
common = ["fd-find", "git-delta", "jq", "ripgrep", "tmux", "unzip", "zoxide"]
personal = ["build-essential", "gh", "ncdu", "tealdeer", "zsh"]
devbox = ["gh"]
server = ["build-essential", "ncdu", "tealdeer", "zsh"]

# Windows machines are always personal, so these are single lists, not per profile.
[packages]
# Windows packages (winget install --id). bin/setup.ps1 installs Git, PowerShell
# and chezmoi first; they're listed here too so they stay installed.
winget = [
    "7zip.7zip",
    "ajeetdsouza.zoxide",
    "Anthropic.ClaudeCode",
    "Bitwarden.Bitwarden",
    "DEVCOM.JetBrainsMonoNerdFont",
    "Discord.Discord",
    "gerardog.gsudo",
    "Git.Git",
    "GitHub.cli",
    "Google.Chrome",
    "jqlang.jq",
    "junegunn.fzf",
    "Microsoft.PowerShell",
    "Microsoft.PowerToys",
    "Microsoft.VisualStudioCode",
    "Microsoft.WindowsTerminal",
    "Mozilla.Firefox",
    "sharkdp.fd",
    "Tailscale.Tailscale",
    "twpayne.chezmoi",
    "VideoLAN.VLC",
]
# PowerShell modules (Install-Module), used by the PowerShell profile.
psmodule = ["posh-git", "PSFzf", "PSReadLine"]
