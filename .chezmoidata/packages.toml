# Packages installed for each profile, by package manager.
# Every profile gets the manager's "common" list plus its own list, if any.

# macOS CLI tools (brew install)
[packages.brew]
common = [
    "fd",
    "fzf",
    "gh",
    "git-delta",
    "lazygit",
    "neovim",
    "python-yq",
    "ripgrep",
    "sesh",
    "tmux",
    "zoxide",
]
personal = ["cloudflared", "mise", "ncdu", "tlrc"]

# macOS GUI apps (brew install --cask)
[packages.cask]
common = ["ghostty", "raycast", "scroll-reverser"]
personal = [
    "antigravity-cli",
    "codex",
    "firefox",
    "google-chrome",
    "google-gemini",
    "karabiner-elements",
    "nordvpn",
    "orbstack",
    "tailscale-app",
    "visual-studio-code",
    "vlc",
    "zoom",
]

# Linux packages (apt install). fzf, lazygit (not on servers), sesh and nvim
# come from .chezmoiexternal.toml.tmpl instead.
[packages.apt]
common = ["fd-find", "ripgrep", "tmux", "unzip", "zoxide"]
personal = ["build-essential", "gh", "git-delta", "ncdu", "tldr", "yq", "zsh"]
devbox = ["gh", "git-delta", "yq"]
server = ["build-essential", "ncdu", "tldr", "zsh"]
